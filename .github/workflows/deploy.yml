name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Restore the latest successful public snapshot across weekly deployments.
      - name: Restore TypeRacer snapshot
        uses: actions/cache/restore@v4
        with:
          path: src/data/typeracer.json
          key: typeracer-play-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            typeracer-play-v1-

      - name: Refresh public TypeRacer statistics
        run: npm run refresh:typeracer
        env:
          TYPERACER_API_KEY: ${{ secrets.TYPERACER_API_KEY }}

      - name: Validate
        run: |
          npm test
          npm run lint

      - name: Build with Vite
        run: npm run build
        env:
          # Public endpoint URL only; the API key remains a backend secret.
          VITE_TYPERACER_API_URL: ${{ vars.TYPERACER_API_URL }}

      - name: Save public TypeRacer snapshot
        uses: actions/cache/save@v4
        with:
          path: src/data/typeracer.json
          key: typeracer-play-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4